name: "Publish"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: ["testpypi", "pypi"]
        default: "testpypi"

permissions:
  contents: read

jobs:
  build:
    name: "build and check"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip

    - name: Check the version against the tag
      if: github.event_name == 'release'
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        tag="${GITHUB_REF_NAME#v}"
        if [ "$version" != "$tag" ]; then
          echo "::error::The release is tagged \"${GITHUB_REF_NAME}\" but pyproject.toml says \"${version}\"."
          exit 1
        fi
        echo "Publishing version ${version}."

    - name: Install the libraries Qt needs to start
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
                                libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

    - name: Install Spark and the tools that build it
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[editor]"
        python -m pip install pytest build twine

    - name: Run the tests
      run: pytest -q --device=cpu

    - name: Build the distribution
      run: |
        rm -rf build spark_snn.egg-info
        python -m build

    - name: Read back what was built
      run: |
        python - <<'CHECK'
        import glob, sys, zipfile

        wheel = glob.glob('dist/*.whl')[0]
        with zipfile.ZipFile(wheel) as archive:
            names = archive.namelist()
            metadata = archive.read(
                next(name for name in names if name.endswith('.dist-info/METADATA'))
            ).decode().splitlines()

        assets = [n for n in names if n.startswith('spark/graph_editor/styles/') and not n.endswith('.py')]
        qt = [line for line in metadata if line.startswith('Requires-Dist: PySide6')]
        optional = [line for line in qt if 'extra == "editor"' in line]

        problems = []
        if any(n.startswith('spark/core/kernels/') for n in names):
            problems.append('the experimental kernels are in it')
        if not any(n.startswith('spark/nn/') for n in names):
            problems.append('the framework itself is missing')
        if not any(n.startswith('spark/graph_editor/') for n in names):
            problems.append('the editor is missing')
        if not assets:
            problems.append('the editor carries no style, so it cannot start')
        if not qt:
            problems.append('nothing asks for PySide6, so the extra installs nothing')
        if len(optional) != len(qt):
            problems.append('PySide6 is required outright rather than by the extra')
        if 'Provides-Extra: editor' not in metadata:
            problems.append('it offers no "editor" extra')

        if problems:
            print(f'::error::{wheel} is not what it should be: {"; ".join(problems)}.')
            sys.exit(1)
        print(f'{wheel}: {len(names)} entries, {len(assets)} editor assets, {len(optional)} behind [editor]')
        CHECK

    - name: Check the metadata
      run: python -m twine check dist/*

    - name: Keep the distribution
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: dist/
        if-no-files-found: error

  publish:
    name: "publish"
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'testpypi' || 'release' }}

    permissions:
      id-token: write

    steps:
    - name: Take the distribution that was built
      uses: actions/download-artifact@v4
      with:
        name: distribution
        path: dist/

    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
        print-hash: true
