[pytest]
filterwarnings =
    ignore:jax\.array_ref is deprecated:DeprecationWarning:flax.*
    ignore:jax\.ArrayRef is deprecated:DeprecationWarning:flax.*

testpaths = tests
# With "-n <workers>", the tests of a module marked with xdist_group share a worker, and with it the fixtures the module
# computes once.
addopts = --dist loadgroup
python_files = *.py
python_classes = Test*
python_functions = test_*
